<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -128 256 256" width="256" height="256" role="img" aria-label="Kindred Quill">
  <!-- Single-color mark: the ink shapes (ring, quill) are painted once in
       currentColor, and the detail that would otherwise be drawn in cream on
       top of them (feather barbs, spine, and the gap separating quill from
       ring) is knocked out of the mask instead — so it reads as transparent
       against whatever surface the mark sits on, in either theme, rather than
       matching one hard-coded background. The #fff/#000 below are mask
       luminance channels, not design colors.

       Tuned for small display (the app header renders it at 48px): the ring
       stroke is 15 rather than 28 so its counter stays open, the barbs are
       three heavy strokes rather than four fine ones (four fell below the
       legibility threshold and smeared), the knockout gap around the quill is
       widened to 9 so it separates cleanly from the ring, and the detached nib
       speck is dropped — at this size it read as dust. The quill still crosses
       the ring at the lower right, which is the source artwork's gesture. -->
  <mask id="kq-mark-cut">
    <g transform="scale(0.92)">
      <circle r="86" fill="none" stroke="#fff" stroke-width="15"></circle>
      <g transform="rotate(-42) scale(0.92) translate(0 118)">
        <g transform="scale(-1 1)">
          <path d="M-8 -160 C-30 -140 -42 -118 -44 -96 L-34 -100 L-42 -78 L-32 -80 L-36 -60 L-4 -46 C10 -80 8 -130 -8 -160 Z" fill="#fff" stroke="#000" stroke-width="9" stroke-linejoin="round"></path>
          <path d="M-7 -126 L-32 -114 M-6 -102 L-34 -89 M-5 -76 L-29 -65" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"></path>
          <path d="M-8 -150 L-4 -46 L-2 -30" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"></path>
        </g>
      </g>
    </g>
  </mask>
  <rect x="-128" y="-128" width="256" height="256" fill="currentColor" mask="url(#kq-mark-cut)"></rect>
</svg>
