name = "kindredquill-edge"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

[vars]
# Rails origin the dynamic islands proxy to (phase-2 §2.5). Empty = islands
# stay off and the Worker serves static bytes only, exactly as before.
RAILS_ORIGIN = ""

# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   ISLAND_AUTH — the shared island-auth header value; the same secret lives
#   in Rails credentials as island_auth_secrets (an array, so current + next
#   can overlap during a rotation). See docs/newsletter-bot-protection-plan.md §2a.

[[r2_buckets]]
binding = "SITES"
bucket_name = "kindredquill-sites"

[[kv_namespaces]]
binding = "HOSTNAMES"
id = "31cc38518280423694f78a0ae0726878"
